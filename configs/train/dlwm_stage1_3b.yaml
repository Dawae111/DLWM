# Same recipe as the 7B run, with a smaller base model.
model_id: Qwen/Qwen2.5-VL-3B-Instruct
enable_dlwm: true
dlwm_num_worlds: 4
dlwm_hidden_size: 4096
dlwm_compute_budget: 10
dlwm_lambda_orth: 0.1
dlwm_lambda_steps: 0.05
dlwm_lambda_worlds: 0.1
dlwm_use_rl: false
dlwm_max_steps: 8
dlwm_merge_mode: score_softmax
dlwm_merge_fixed_beta: 0.5
dlwm_merge_temperature: 1.0
dlwm_merge_topk_pairs: 1
dlwm_expand_cost: 1.0
dlwm_stop_cost: 0.1
dlwm_merge_cost: 0.5
dlwm_answer_cost: 0.0
dlwm_dropout: 0.1
dlwm_reasoner_layers: 6
dlwm_reasoner_heads: 8
dlwm_reasoner_ffn_multiplier: 4.0
dlwm_world_generator_residual: false
dlwm_diversity_regularizer: orthogonal
dlwm_diversity_margin: 0.2
dlwm_enable_expand: true
dlwm_enable_stop: true
dlwm_enable_merge: true
dlwm_prediction_chunk_size: 8
dlwm_aggregation: probability_mixture
data_path: ./data/dlwm_official/train_dlwm.json
dataset_format: sft
image_folder: ./data/images
output_dir: ./output/dlwm_stage1_3b
run_name: dlwm-stage1-3b
seed: 42
dlwm_stage: stage1
do_train: true
max_steps: 2500
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00002
weight_decay: 0.02
warmup_ratio: 0.03
lr_scheduler_type: cosine
logging_steps: 1
save_steps: 100
save_total_limit: 2
bf16: true
disable_flash_attn2: true
gradient_checkpointing: true
freeze_vision_tower: true
freeze_llm: true
remove_unused_columns: false
report_to: wandb
deepspeed: scripts/zero2.json
